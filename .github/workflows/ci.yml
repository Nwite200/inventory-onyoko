name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # type-checks the app, server and tests, then builds the PWA
      - run: npm run build
      # includes the server, two-device sync, voice, printing and browser-compatibility tests
      # (the speech-model tests skip themselves when the 100 MB model is not installed)
      - run: npm test
